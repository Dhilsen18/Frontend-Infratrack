<mat-button-toggle-group
  class="lang-switch"
  [value]="currentLang"
  appearance="standard"
  aria-label="{{ 'common.language' | translate }}"
  name="language"
>
  @for (language of languages; track language) {
    <mat-button-toggle (click)="useLanguage(language)" [aria-label]="language" [value]="language">
      {{ language.toUpperCase() }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
